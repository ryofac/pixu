name: Publish private VM images to GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-vm-images-ghcr-main
  cancel-in-progress: true

jobs:
  publish-vm-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Compilar assets
        run: |
          npm ci
          npm run build

      - name: Preparar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Django
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/production/django/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ryofac/pixu-django:sha-${{ github.sha }}
            ghcr.io/ryofac/pixu-django:main
          labels: |
            org.opencontainers.image.source=https://github.com/ryofac/pixu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pixu-django
          cache-to: type=gha,mode=max,scope=pixu-django

      - name: Publicar PostgreSQL
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/production/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ryofac/pixu-postgres:sha-${{ github.sha }}
            ghcr.io/ryofac/pixu-postgres:main
          labels: |
            org.opencontainers.image.source=https://github.com/ryofac/pixu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pixu-postgres
          cache-to: type=gha,mode=max,scope=pixu-postgres

      - name: Publicar Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/production/nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ryofac/pixu-nginx:sha-${{ github.sha }}
            ghcr.io/ryofac/pixu-nginx:main
          labels: |
            org.opencontainers.image.source=https://github.com/ryofac/pixu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pixu-nginx
          cache-to: type=gha,mode=max,scope=pixu-nginx

      - name: Publicar Traefik
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/production/traefik/vm.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ryofac/pixu-traefik:sha-${{ github.sha }}
            ghcr.io/ryofac/pixu-traefik:main
          labels: |
            org.opencontainers.image.source=https://github.com/ryofac/pixu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pixu-traefik
          cache-to: type=gha,mode=max,scope=pixu-traefik
