name: pixu-vm

volumes:
  pixu_vm_postgres_data: {}
  pixu_vm_postgres_data_backups: {}
  pixu_vm_redis_data: {}
  pixu_vm_media: {}
  pixu_vm_traefik_acme: {}

x-django-environment: &django-environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
  DJANGO_ACCOUNT_ALLOW_REGISTRATION: ${DJANGO_ACCOUNT_ALLOW_REGISTRATION:-True}
  DJANGO_GOOGLE_OAUTH_CLIENT_ID: ${DJANGO_GOOGLE_OAUTH_CLIENT_ID:-}
  DJANGO_GOOGLE_OAUTH_CLIENT_SECRET: ${DJANGO_GOOGLE_OAUTH_CLIENT_SECRET:-}
  DJANGO_GITHUB_OAUTH_CLIENT_ID: ${DJANGO_GITHUB_OAUTH_CLIENT_ID:-}
  DJANGO_GITHUB_OAUTH_CLIENT_SECRET: ${DJANGO_GITHUB_OAUTH_CLIENT_SECRET:-}
  DJANGO_SERVER_EMAIL: ${DJANGO_SERVER_EMAIL}
  DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL}
  DJANGO_EMAIL_SUBJECT_PREFIX: ${DJANGO_EMAIL_SUBJECT_PREFIX:-[Pixu] }
  DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-pixu.accounts.email_backends.CeleryEmailBackend}
  DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST}
  DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
  DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER}
  DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD}
  DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-True}
  DJANGO_EMAIL_USE_SSL: ${DJANGO_EMAIL_USE_SSL:-False}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  CELERY_EMAIL_DELIVERY_BACKEND: ${CELERY_EMAIL_DELIVERY_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  PIXU_RECEIPT_MAX_BYTES: ${PIXU_RECEIPT_MAX_BYTES:-10485760}
  PIXU_RECEIPT_ALLOWED_TYPES: ${PIXU_RECEIPT_ALLOWED_TYPES:-application/pdf,image/jpeg,image/png}
  PIXU_STORAGE_BACKEND: ${PIXU_STORAGE_BACKEND:-django.core.files.storage.FileSystemStorage}
  PIXU_S3_BUCKET_NAME: ${PIXU_S3_BUCKET_NAME:-pixu-private}
  PIXU_S3_ENDPOINT_URL: ${PIXU_S3_ENDPOINT_URL:-}
  PIXU_S3_REGION_NAME: ${PIXU_S3_REGION_NAME:-us-east-1}
  PIXU_S3_ACCESS_KEY_ID: ${PIXU_S3_ACCESS_KEY_ID:-}
  PIXU_S3_SECRET_ACCESS_KEY: ${PIXU_S3_SECRET_ACCESS_KEY:-}
  PIXU_S3_ADDRESSING_STYLE: ${PIXU_S3_ADDRESSING_STYLE:-auto}
  PIXU_S3_USE_SSL: ${PIXU_S3_USE_SSL:-False}

services:
  django: &django
    image: ${PIXU_DJANGO_IMAGE:-ghcr.io/ryofac/pixu-django:${PIXU_IMAGE_TAG:-main}}
    restart: unless-stopped
    environment: *django-environment
    volumes:
      - pixu_vm_media:/app/pixu/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /start

  celeryworker:
    <<: *django
    image: ${PIXU_DJANGO_IMAGE:-ghcr.io/ryofac/pixu-django:${PIXU_IMAGE_TAG:-main}}
    command: /start-celeryworker

  postgres:
    image: ${PIXU_POSTGRES_IMAGE:-ghcr.io/ryofac/pixu-postgres:${PIXU_IMAGE_TAG:-main}}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pixu_vm_postgres_data:/var/lib/postgresql/18/docker
      - pixu_vm_postgres_data_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: ${PIXU_REDIS_IMAGE:-redis:7.2}
    restart: unless-stopped
    volumes:
      - pixu_vm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nginx:
    image: ${PIXU_NGINX_IMAGE:-ghcr.io/ryofac/pixu-nginx:${PIXU_IMAGE_TAG:-main}}
    restart: unless-stopped
    volumes:
      - pixu_vm_media:/usr/share/nginx/media:ro

  traefik:
    image: ${PIXU_TRAEFIK_IMAGE:-ghcr.io/ryofac/pixu-traefik:${PIXU_IMAGE_TAG:-main}}
    restart: unless-stopped
    depends_on:
      - django
      - nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - pixu_vm_traefik_acme:/etc/traefik/acme
      - ${PIXU_TRAEFIK_CONFIG:-/opt/pixu/traefik/traefik.yml}:/etc/traefik/traefik.yml:ro
