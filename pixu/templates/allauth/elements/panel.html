{% load allauth %}

<section class="mb-4 rounded-[20px] border border-pixu-border bg-pixu-surface p-4 shadow-sm">
  {% if slots.title %}<h2 class="mb-3 text-lg font-extrabold text-pixu-ink">{% slot title %}{% endslot %}</h2>{% endif %}
  {% slot body %}{% endslot %}
  {% if slots.actions %}
    <ul class="mt-4 grid gap-2">
      {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
    </ul>
  {% endif %}
</section>
