{% load form_fields i18n %}
<div class="relative min-w-0" data-file-upload>
  {% render_accessible_field field %}
  <label class="group flex min-h-[4.5rem] flex-wrap cursor-pointer items-center gap-3 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 px-4 py-3 transition hover:border-sakura-5 hover:bg-sakura-4 peer-focus-visible:border-sakura-6 peer-focus-visible:ring-4 peer-focus-visible:ring-sakura-2 sm:flex-nowrap" for="{{ field.id_for_label }}">
    <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-sakura-2 text-pixu-action" aria-hidden="true">
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13.5 5.5H7.75A1.75 1.75 0 0 0 6 7.25v9.5a1.75 1.75 0 0 0 1.75 1.75h8.5A1.75 1.75 0 0 0 18 16.75V10Z" /><path d="M13.5 5.5v4.25H18M9.5 14.5l2.5-2.5 2.5 2.5M12 12v5" /></svg>
    </span>
    <span class="min-w-0 flex-1">
      <span class="block truncate text-xs font-extrabold text-pixu-muted sm:text-sm" data-file-name data-empty-label="{% translate 'Nenhum arquivo selecionado' %}">{% translate "Nenhum arquivo selecionado" %}</span>
      <span class="mt-0.5 block text-xs text-pixu-muted">{% translate "Clique para escolher um arquivo" %}</span>
    </span>
    <span class="w-full shrink-0 rounded-lg bg-pixu-action-solid px-3 py-2 text-center text-xs font-extrabold text-white transition group-hover:brightness-110 sm:w-auto"><span class="sm:hidden">{% translate "Escolher" %}</span><span class="hidden sm:inline">{% translate "Escolher arquivo" %}</span></span>
  </label>
</div>
