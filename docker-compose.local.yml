volumes:
  pixu_local_postgres_data: {}
  pixu_local_postgres_data_backups: {}
  pixu_local_redis_data: {}
  pixu_local_garage_data: {}
  pixu_local_garage_config: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: local
    image: pixu_local_django
    container_name: pixu_local_django
    depends_on:
      - postgres
      - redis
      - garage
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
      - path: .env
        required: false
    ports:
      - "8000:8000"
    command: /start

  celeryworker:
    <<: *django
    image: pixu_local_celeryworker
    container_name: pixu_local_celeryworker
    depends_on:
      - postgres
      - redis
      - garage
    ports: []
    command: /start-celeryworker

  e2e-postgres:
    image: docker.io/postgres:18
    container_name: pixu_e2e_postgres
    environment:
      POSTGRES_DB: pixu_e2e
      POSTGRES_USER: pixu_e2e
      POSTGRES_PASSWORD: pixu_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixu_e2e -d pixu_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20

  e2e:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: e2e
    image: pixu_local_e2e
    container_name: pixu_local_e2e
    depends_on:
      e2e-postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_DEBUG: "False"
      DJANGO_ACCOUNT_ALLOW_REGISTRATION: "True"
      # pytest-playwright's sync API runs an asyncio loop in the pytest thread.
      # E2E tests are serial and the application uses synchronous Django views.
      DJANGO_ALLOW_ASYNC_UNSAFE: "true"
      DATABASE_URL: postgres://pixu_e2e:pixu_e2e@e2e-postgres:5432/pixu_e2e
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CELERY_TASK_ALWAYS_EAGER: "True"
      CELERY_TASK_EAGER_PROPAGATES: "True"
    volumes:
      - /app/.venv
      - .:/app:z
    entrypoint: ["wait-for-it", "e2e-postgres:5432", "--strict", "--timeout=60", "--"]
    command: ["pytest"]

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: pixu_production_postgres
    container_name: pixu_local_postgres
    volumes:
      - pixu_local_postgres_data:/var/lib/postgresql/18/docker
      - pixu_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  redis:
    image: docker.io/redis:7.2
    container_name: pixu_local_redis
    volumes:
      - pixu_local_redis_data:/data

  garage-config:
    image: docker.io/alpine:3.22
    container_name: pixu_local_garage_config
    env_file:
      - path: ./.envs/.local/.garage
        required: false
    volumes:
      - pixu_local_garage_config:/config
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        cat > /config/garage.toml <<EOF
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "sqlite"
        replication_factor = 1
        rpc_bind_addr = "[::]:3901"
        rpc_public_addr = "garage:3901"
        rpc_secret = "$${GARAGE_RPC_SECRET}"
        [s3_api]
        s3_region = "$${PIXU_S3_REGION_NAME}"
        api_bind_addr = "[::]:3900"
        root_domain = ".s3.garage.localhost"
        [s3_web]
        bind_addr = "[::]:3902"
        root_domain = ".web.garage.localhost"
        index = "index.html"
        [admin]
        api_bind_addr = "[::]:3903"
        admin_token = "$${GARAGE_ADMIN_TOKEN}"
        metrics_token = "$${GARAGE_METRICS_TOKEN}"
        EOF

  garage:
    image: docker.io/dxflrs/garage:v2.3.0
    container_name: pixu_local_garage
    depends_on:
      garage-config:
        condition: service_completed_successfully
    env_file:
      - path: ./.envs/.local/.garage
        required: false
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
    volumes:
      - pixu_local_garage_data:/var/lib/garage
      - pixu_local_garage_config:/etc/garage:ro
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    command: ["/garage", "server", "--single-node", "--default-bucket"]
